<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cotización de producto</title>
  <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
  <link rel="stylesheet" href="css/actividad3.css" />
</head>
<body>

  <!-- Formulario para realizar una cotización -->
  <!-- Compra de una PC / portatil -->
  <!-- Existen cambios obligatorios -->
  <!-- Generar un cuadro de dialogo con la confirmación-->
  <!-- Aplicar estilos css-->

    <section class="section">
      <div class="container">
        <p class="eyebrow has-text-centered">COMPRA DE EQUIPO</p>
        <h2 class="title has-text-centered">Cotización</h2>
        <p class="subtitulo has-text-centered">Completa los datos para calcular el precio final.</p>
        <div class="columns is-centered">
          <div class="column is-half">
            <form class="box cotizacion" action="" autocomplete="off" id="formulario">
              <h3 class="grupo-titulo">Datos del cliente</h3>
              <div class="campos-grid">
                <div class="field">
                  <label class="label" for="nombres">Nombres</label>
                  <input type="text" class="input" id="nombres" minlength="3" placeholder="Ej. María" required />
                </div>
                <div class="field">
                  <label class="label" for="apellidos">Apellidos</label>
                  <input type="text" class="input" id="apellidos" minlength="3" placeholder="Ej. Pérez" required />
                </div>
                <div class="field">
                  <label class="label" for="telefono">Número de teléfono</label>
                  <input type="text" class="input" id="telefono" minlength="9" placeholder="Tu número de contacto" required />
                </div>
                <div class="field">
                  <label class="label" for="dni">DNI</label>
                  <input type="text" class="input" id="dni" minlength="8" placeholder="Tu número de DNI" required />
                </div>
              </div>

              <h3 class="grupo-titulo">Producto y precio</h3>
              <div class="campos-grid">
                <div class="field seleccion-producto">
                  <label class="label">Selecciona un producto</label>
                  <div class="selector-productos">
                    <input type="radio" id="productoLaptop" name="producto" value="Laptop" required checked />
                    <label for="productoLaptop">
                      <img src="images/portatil.webp" alt="" />
                      <span>Laptop</span>
                    </label>
                    <input type="radio" id="productoEscritorio" name="producto" value="Computadora de escritorio" />
                    <label for="productoEscritorio">
                      <img src="images/Computadora-escritorio.webp" alt="" />
                      <span>Computadora de escritorio</span>
                    </label>
                    <input type="radio" id="productoMonitor" name="producto" value="Monitor" />
                    <label for="productoMonitor">
                      <img src="images/monitor.webp" alt="" />
                      <span>Monitor</span>
                    </label>
                  </div>
                </div>
                <div class="field">
                  <label class="label" for="precio">Precio con IGV (S/)</label>
                  <input type="number" class="input" value="0" id="precio" placeholder="Ingrese el precio" min="0" step="0.01" required />
                </div>
              </div>

              <h3 class="grupo-titulo">Resumen de la cotización</h3>
              <div class="resumen-grid">
                <div class="field">
                  <label class="label" for="subtotal">Subtotal</label>
                  <input type="text" class="input" value="0.00" id="subtotal" readonly />
                </div>
                <div class="field">
                  <label class="label" for="igv">IGV (18%)</label>
                  <input type="text" class="input" value="0.00" id="igv" readonly />
                </div>
                <div class="field total-field">
                  <label class="label" for="total">Total (S/)</label>
                  <input type="text" class="input" value="0.00" id="total" readonly />
                </div>
              </div>

              <div class="acciones">
                <button class="button boton-principal" type="submit">Realizar cotización</button>
                <button class="button boton-secundario" type="reset">Reiniciar</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>

    <script>
      const precio = document.getElementById("precio");
      const subtotal = document.getElementById("subtotal");
      const igv = document.getElementById("igv");
      const total = document.getElementById("total");
      const formulario = document.getElementById("formulario");
      precio.addEventListener("input", function(){
        const precioIngreso = parseFloat(precio.value) || 0;

        const subtotalCal = precioIngreso / 1.18;
        const calculoigv =  precioIngreso - subtotalCal;
        const totalCal = precioIngreso;

        subtotal.value = subtotalCal.toFixed(2);
        igv.value = calculoigv.toFixed(2);
        total.value = totalCal.toFixed(2);
      })

      formulario.addEventListener("submit", function(event){
        event.preventDefault();

        if (confirm("¿Estas seguro de proceder con esta cotización?")){
          alert("!Cotización hecha de manera correcta!")
        }
      })

    </script>
</body>
</html>
